<label for="role">Account Type</label>

<select id="role" required>
    <option value="">Select account type</option>

    <option value="citizen">
        Citizen
    </option>

    <option value="student">
        Student
    </option>

    <option value="industry">
        Industry / Organization
    </option>
</select>

<!-- STUDENT VERIFICATION FIELDS -->

<div id="studentFields" class="verification-fields">

    <label for="collegeName">
        College / University Name
    </label>

    <input
        type="text"
        id="collegeName"
        placeholder="Enter your college/university name"
    >

    <label for="studentId">
        Student ID / Enrollment Number
    </label>

    <input
        type="text"
        id="studentId"
        placeholder="Enter your student ID"
    >

    <div class="verification-note">
        Student verification will be required before
        accessing student-specific features.
    </div>

</div>


<!-- INDUSTRY VERIFICATION FIELDS -->

<div id="industryFields" class="verification-fields">

    <label for="organizationName">
        Organization / Company Name
    </label>

    <input
        type="text"
        id="organizationName"
        placeholder="Enter organization name"
    >

    <label for="officialEmail">
        Official Organization Email
    </label>

    <input
        type="email"
        id="officialEmail"
        placeholder="Enter official email"
    >

    <label for="registrationDetails">
        Registration / Verification Details
    </label>

    <input
        type="text"
        id="registrationDetails"
        placeholder="Company/Organization registration details"
    >

    <div class="verification-note">
        Industry verification will be required before
        accessing industry-specific features.
    </div>

</div>
